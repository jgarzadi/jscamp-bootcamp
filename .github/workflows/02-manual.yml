name: 02 - Manual

on:
    workflow_dispatch:
        inputs:
            logging_level:
                description: 'Logging level'
                required: true
                default: 'info'
                type: choice
                options: [
                    'debug',
                    'info',
                    'warn',
                    'error'
                ]
            environment:
                description: 'Deployment environment'
                required: true
                default: 'dev'
                type: choice
                options: [
                    'dev',
                    'staging',
                    'prod'
                ]
            dry_run:
                description: 'Dry run'
                required: true
                default: false
                type: boolean
            reason:
                description: 'Reason for execution'
                required: false
                default: 'Manual execution'
                type: string
jobs:
    manual:
        runs-on: ubuntu-24.04
        steps:
            - name: Print inputs
              env:
                LOGGING_LEVEL: ${{ inputs.logging_level }}
                ENVIRONMENT: ${{ inputs.environment }}
                DRY_RUN: ${{ inputs.dry_run }}
                REASON: ${{ inputs.reason }}
              run: |
                echo "LOG_LEVEL: $LOGGING_LEVEL"
                echo "ENVIRONMENT: $ENVIRONMENT"
                echo "DRY_RUN: $DRY_RUN"
                echo "REASON: $REASON"

            - name: Dry run
              if: ${{ inputs.dry_run }}
              run: |
                echo "Dry run mode - no changes will be made"

            - name: Deploy
              env:
                  ENVIRONMENT: ${{ inputs.environment }}
              if: ${{ !inputs.dry_run }}
              run: |
                    echo "Deploying to $ENVIRONMENT"
