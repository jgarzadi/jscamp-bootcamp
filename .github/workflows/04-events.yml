name: 04 - Events

on:
    workflow_dispatch:
    issues:
        types: 
            - opened
            - assigned
    issue_comment:
        types:
            - created
    pull_request_review_comment:
        types: 
            - created
    
jobs:
    inspect-event:
        runs-on: ubuntu-24.04
        permissions:
            issues: write
        steps:
            - name: Print event details
              run: |
                echo "Event Name: ${{ github.event_name }}"
                echo "Issue Number: ${{ github.event.issue.number }}"
                echo "Event Body: ${{ github.event.comment.body }}"

            - name: Add comment as bot
              if: ${{ github.event_name == 'issues' && github.event.action == 'opened' }}
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                ISSUE_NUMBER: ${{ github.event.issue.number }}
              run: |
                gh issue comment $ISSUE_NUMBER --body "Thank you for opening this issue! A team member will review it shortly." --repo ${{ github.repository }} --token $GH_TOKEN
              